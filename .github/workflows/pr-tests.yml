name: Run on Pull Request

on:
  pull_request:
    branches:
      - main # or the branch you want to target

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run E2E tests (all tests)
        run: echo "All E2E tests are running"
