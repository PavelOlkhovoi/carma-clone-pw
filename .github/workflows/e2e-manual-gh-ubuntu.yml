name: Manual E2E Runner gh-ubuntu

on:
  workflow_dispatch:
    inputs:
      project-name:
        description: "Nx project name (e.g., x-and-ride)"
        required: true
        type: string
      test-name:
        description: "Specific test name to run (optional)"
        required: false
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: add cismet-dev registry secret to .npmrc
        shell: bash
        run: |
          touch .npmrc
          echo "${{ secrets.CISMET_DEV_REGISTRY_SECRET_4_DOT_NPMRC }}" >> .npmrc

      - name: Restore node_modules from cache
        id: smoke-test-node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ needs.determine_projects.outputs.node-modules-cache-key }}

      - name: Install dependencies
        if: steps.smoke-test-node-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Run E2E tests (all tests)
        if: github.event.inputs['test-name'] == ''
        run: npx nx e2e e2e-${{ github.event.inputs['project-name'] }} --skip-nx-cache --skipInstall --parallel=1

      - name: Run E2E tests (specific test)
        if: github.event.inputs['test-name'] != ''
        run: npx nx e2e e2e-${{ github.event.inputs['project-name'] }} --skip-nx-cache --skipInstall --grep="${{ github.event.inputs['test-name'] }}"
