name: Flaky tester
run-name: >
  🤞 : Flaky tester
on:
  workflow_dispatch:
    inputs:
      project-name:
        description: "Nx project name (e.g., x-and-ride)"
        required: true
        type: string
      test-name:
        description: "Test name (e.g., test-name)"
        required: true
        type: string
      repetitions-number:
        description: "Number of repetitions (e.g., 10)"
        required: true
        type: string

jobs:
  e2e:
    name: "E2E Test: ${{ github.event.inputs['project-name'] }}/${{ github.event.inputs['test-name'] }} ${{ github.event.inputs['repetitions-number'] }} times"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: add cismet-dev registry secret to .npmrc
        shell: bash
        run: |
          touch .npmrc
          echo "${{ secrets.CISMET_DEV_REGISTRY_SECRET_4_DOT_NPMRC }}" >> .npmrc

      - name: Generate node_modules cache key
        id: node-cache-key
        run: |
          echo "key=node-modules-${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Restore node_modules from cache
        id: e2e-manual-node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ steps.node-cache-key.outputs.key }}

      - name: Install dependencies
        if: steps.e2e-manual-node-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Run E2E test ${{ github.event.inputs['project-name'] }}/${{ github.event.inputs['test-name'] }}/${{ github.event.inputs['repetitions-number'] }}
        run: PW_CHANNEL=chrome npx nx e2e e2e-${{ github.event.inputs['project-name'] }} --grep=${{ github.event.inputs['test-name'] }} --repeat-each=${{ github.event.inputs['repetitions-number'] }} --skip-nx-cache --skipInstall --workers=5
